name: Build APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"
      - "manager/**"
      - "server/**"
      - "adb/**"
      - "reignite/**"
      - "api/**"
      - "*.gradle.kts"
      - "gradle/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install NDK, CMake, platform and build-tools
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;29.0.14206865" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0"

      - name: Build reignite DEX
        run: ./gradlew :reignite:assembleDebug

      - name: Build manager APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: axora-debug-apk
          path: manager/build/outputs/apk/**/Axora_v*.apk
          if-no-files-found: error

  build-release:
    name: Build release APK
    # Manual only: requires the release signing secrets
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install NDK, CMake, platform and build-tools
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;29.0.14206865" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AXORA_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > axora-release.keystore

      - name: Write signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "keystore.password=$KEYSTORE_PASSWORD"
            echo "key.password=$KEY_PASSWORD"
          } > local.properties

      - name: Build reignite DEX
        run: ./gradlew :reignite:assembleDebug

      - name: Build manager APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: axora-release-apk
          path: manager/build/outputs/apk/**/Axora_v*.apk
          if-no-files-found: error
