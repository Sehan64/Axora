name: Build APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"
      - "manager/**"
      - "server/**"
      - "adb/**"
      - "reignite/**"
      - "api/**"
      - "*.gradle.kts"
      - "gradle/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;29.0.13113866" "cmake;3.31.6"

      - name: Build reignite DEX
        run: ./gradlew :reignite:assembleDebug

      - name: Build manager APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: axora-debug-apk
          path: manager/build/outputs/apk/**/Axora_v*.apk
          if-no-files-found: error
